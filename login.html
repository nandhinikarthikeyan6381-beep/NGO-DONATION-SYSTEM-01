{% extends "base.html" %}
{% block content %}
<div class="container py-5">
<div class="row justify-content-center"><div class="col-md-6">
<div class="card p-4 p-md-5">
<h2 class="fw-bold">Login</h2><p class="text-secondary">Open your role-specific dashboard.</p>
<form method="post">
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>

</form>
<div class="mt-4 small text-secondary">Local testing: open <a href="{{ url_for('seed_demo') }}">Create demo accounts</a>.</div>
</div></div></div>
</div>
{% endblock %}
