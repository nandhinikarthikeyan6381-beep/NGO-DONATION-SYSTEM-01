{% extends "base.html" %}
{% block content %}
<div class="container py-5">
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card p-4 p-md-5">
<h2 class="fw-bold">Create Account</h2><p class="text-secondary">Choose your role to get the correct dashboard.</p>
<form method="post">
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Full Name *</label><input name="name" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
</div>
<div class="mb-3"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Password *</label><input type="password" name="password" class="form-control" minlength="6" required></div>
<div class="mb-3"><label class="form-label">Role *</label><select name="role" class="form-select" required><option value="">Select role</option><option value="donor">Donor</option><option value="volunteer">Volunteer</option><option value="ngo">NGO</option></select></div>
<div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="3"></textarea></div>
<button class="btn btn-primary w-100">Register</button>
</form>
<p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div></div></div>
</div>
{% endblock %}
